{% extends "base.html" %}
{% block content %}

<h1>Admin Panel</h1>

<table border="1">
<tr><th>ID</th><th>Product</th><th>Price</th><th>Txn</th></tr>

{% for o in orders %}
<tr>
<td>{{o.id}}</td>
<td>{{o.product}}</td>
<td>{{o.price}}</td>
<td>{{o.txn_id}}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
