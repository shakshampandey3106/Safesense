{% extends "base.html" %}
{% block content %}

<h1 style="text-align:center;">💳 Checkout</h1>

<div class="card" style="max-width:420px; margin:auto; text-align:center;">

    <h2 id="product"></h2>
    <p id="price" style="font-size:18px;"></p>

    <hr>

    <!-- PAYMENT OPTIONS -->
    <button id="pay-btn">💳 Pay Online</button>

    <br><br>

    <button onclick="cod()">💵 Cash on Delivery</button>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

// GET DATA
let product = localStorage.getItem("product");
let price = localStorage.getItem("price");

// CART SUPPORT
if(!price){
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let total = 0;

    cart.forEach(item => {
        total += item.price;
    });

    product = "Cart Items";
    price = total;
}

// SHOW DATA
document.getElementById("product").innerText = product;
document.getElementById("price").innerText = "Total: ₹" + price;


// 💳 RAZORPAY PAYMENT
document.getElementById("pay-btn").onclick = function(){

    document.getElementById("pay-btn").innerText = "Processing...";

    fetch("/create-order", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ amount: price })
    })
    .then(res => res.json())
    .then(order => {

        let options = {
            "key": "YOUR_KEY_ID",   // 🔥 replace this
            "amount": order.amount,
            "currency": "INR",
            "name": "SafeSense AI",
            "description": product,
            "order_id": order.id,

            "handler": function (response){

                // VERIFY PAYMENT
                fetch("/verify-payment", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(response)
                })
                .then(res => res.json())
                .then(data => {

                    if(data.status === "success"){
                        alert("✅ Payment Verified!");
                        localStorage.removeItem("cart");
                        window.location.href = "/dashboard";
                    } else {
                        alert("❌ Payment Failed!");
                    }

                });

            }
        };

        let rzp = new Razorpay(options);
        rzp.open();

    });

}


// 💵 CASH ON DELIVERY
function cod(){
    alert("✅ Order placed with Cash on Delivery!");
    localStorage.removeItem("cart");
    window.location.href = "/dashboard";
}

</script>

{% endblock %}
